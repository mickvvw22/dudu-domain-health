name: Health check and Pages deploy
on:
  push:
    branches:
      - '**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout triggering ref
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Run health check
        env:
          GITHUB_ACTIONS: 'true'
        run: python3 scripts/check_health.py
      - name: Upload public monitor JSON
        uses: actions/upload-artifact@v4
        with:
          name: public-monitor-json
          path: latest.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-public-data:
    if: github.ref == 'refs/heads/main'
    needs: check-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
      - name: Download generated monitor JSON
        uses: actions/download-artifact@v4
        with:
          name: public-monitor-json
          path: ${{ runner.temp }}/public-monitor-json
      - name: Validate and publish only the monitor JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/public-monitor-json/latest.json" <<'PY'
          import ipaddress, json, sys
          from datetime import datetime, timezone
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('schema_version') == 1
          assert data.get('source') == 'GitHub Actions / scripts/check_health.py'
          checked = datetime.fromisoformat(data['checked_at'].replace('Z', '+00:00'))
          assert abs((datetime.now(timezone.utc) - checked).total_seconds()) < 3600
          allowed = ('dudu.loc.cc', 'baidu.vvpp.cc')
          chosen = [x for x in data['sites'] if x.get('host') in allowed]
          assert len(chosen) == 2 and {x['host'] for x in chosen} == set(allowed)
          clean = []
          for site in chosen:
              item = {'host': site['host']}
              for kind in ('dns', 'tls', 'http', 'https'):
                  check = site[kind]
                  assert check['status'] in ('ok', 'fail', 'unknown')
                  item[kind] = {'status': check['status']}
              for family, version in (('A', 4), ('AAAA', 6)):
                  addresses = site['dns'].get(family, [])
                  assert len(addresses) <= 100
                  parsed = [ipaddress.ip_address(a) for a in addresses]
                  assert all(a.version == version for a in parsed)
                  item['dns'][family] = [str(a) for a in parsed]
              expiry = site['tls'].get('expires_at')
              if expiry is not None:
                  datetime.fromisoformat(expiry.replace('Z', '+00:00'))
                  item['tls']['expires_at'] = expiry
              for kind in ('http', 'https'):
                  code = site[kind].get('status_code')
                  if type(code) is int and 100 <= code <= 599:
                      item[kind]['status_code'] = code
              clean.append(item)
          public = {'schema_version': 1, 'checked_at': checked.isoformat().replace('+00:00', 'Z'),
                    'source': 'GitHub Actions / scripts/check_health.py', 'sites': clean}
          with open(sys.argv[1], 'w', encoding='utf-8') as f:
              json.dump(public, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin refs/heads/public-monitor-data > /dev/null; then
            git fetch origin refs/heads/public-monitor-data:refs/remotes/origin/public-monitor-data
            git switch -c public-monitor-data refs/remotes/origin/public-monitor-data
          else
            git switch --orphan public-monitor-data
          fi
          cp "$RUNNER_TEMP/public-monitor-json/latest.json" latest.json
          git add latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update public monitor data'
          git push origin HEAD:refs/heads/public-monitor-data
